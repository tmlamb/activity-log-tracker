packages:
  - apps/*
  - packages/*
  - tooling/*

catalog:
  "@eslint/js": 9.39.1
  "@tailwindcss/postcss": 4.2.4
  "@types/node": 22.18.12
  eslint: 9.39.1
  prettier: 3.6.2
  tailwindcss: 4.2.4
  typescript: ~6.0.3

catalogs:
  react19:
    "@types/react": ~19.2.14
    "@types/react-dom": ~19.2.3
    react: 19.2.3
    react-dom: 19.2.3

linkWorkspacePackages: true

onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - esbuild

ignoredBuiltDependencies:
  - core-js-pure

overrides:
  lightningcss: 1.30.1

publicHoistPattern:
  - "@ianvs/prettier-plugin-sort-imports"
  - prettier-plugin-tailwindcss
